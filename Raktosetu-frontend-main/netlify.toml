# Netlify deployment for RaktoSetu frontend (Vite + React Router SPA).
# NOTE: Vite injects VITE_* vars at build time, so set
# VITE_API_BASE_URL=https://raktosetu-backend.onrender.com in
# Netlify Site settings > Environment variables, then redeploy
# with "Clear cache and deploy".
[build]
  command = "npm ci && npm run build"
  publish = "dist/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
